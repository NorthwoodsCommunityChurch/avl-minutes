name: Minutes
options:
  bundleIdPrefix: com.northwoods
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MinutesKit:
    path: Packages/MinutesKit
  AudioDeps:
    path: Packages/AudioDeps
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Minutes:
    type: application
    platform: macOS
    sources:
      - path: Minutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.northwoods.Minutes
        PRODUCT_NAME: Minutes
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Minutes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Minutes/Minutes.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: TQ6Y49W7UW
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MinutesKit
        product: MinutesKit
      - package: MinutesKit
        product: MinutesMCP
      - package: AudioDeps
      - package: Sparkle
    preBuildScripts:
      - name: No audio writes
        script: '"${SRCROOT}/scripts/check-no-audio-writes.sh" "${SRCROOT}"'
        basedOnDependencyAnalysis: false
